<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Results | MathScienceYJR</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">

  <!-- Safety Loader Hide Fallback Script -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var loader = document.getElementById('loader');
        if (loader && !loader.classList.contains('hidden')) {
          loader.classList.add('hidden');
          console.warn('Page loader hidden by safety fallback timeout.');
        }
      }, 1500);
    });
  </script>
</head>

<body>

  <!-- Page Loader -->
  <div class="page-loader" id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Global Header -->
  <div id="global-header"></div>

  <!-- Header Banner -->
  <section class="section-padding reveal active"
    style="padding-top: 140px; background: linear-gradient(180deg, rgba(37, 99, 235, 0.05), transparent); text-align: center;">
    <div class="container">
      <span class="category-badge" style="margin-bottom: 1rem;">Wall of Fame</span>
      <h1 style="font-size: 3rem; margin-bottom: 1rem;">Olympiad & Competitive Success</h1>
      <p class="text-muted" style="max-width: 600px; margin: 0 auto;">Celebrating the extraordinary milestones achieved
        by our students in JEE, NEET, and International Olympiad rounds.</p>
    </div>
  </section>

  <!-- Showcase Grid -->
  <section class="section-padding reveal" style="padding-top: 0;">
    <div class="container">
      <!-- Section: Featured Toppers -->
      <h2 style="font-size: 2rem; margin-bottom: 2rem; border-left: 4px solid var(--secondary); padding-left: 0.75rem;">
        Elite Achievers</h2>
      <div class="grid-3" id="results-featured-grid" style="margin-bottom: 5rem;">
        <!-- Featured Toppers Dynamic List -->
      </div>

      <h2 style="font-size: 2rem; margin-bottom: 2rem; border-left: 4px solid var(--accent); padding-left: 0.75rem;">

      <div class="grid-4" id="results-general-grid">
        <!-- General results dynamic list -->
      </div>
    </div>
  </section>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- WhatsApp Bubble -->
  <div id="global-whatsapp"></div>
