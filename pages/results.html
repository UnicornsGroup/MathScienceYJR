<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Results | MathScienceYJR</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">

  <!-- Safety Loader Hide Fallback Script -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader && !loader.classList.contains('hidden')) {
          loader.classList.add('hidden');
          console.warn('Page loader hidden by safety fallback timeout.');
        }
      }, 1500);
    });
  </script>
</head>
<body>

  <!-- Page Loader -->
  <div class="page-loader" id="loader">
    <div class="spinner"></div>
  </div>

  <!-- Global Header -->
  <div id="global-header"></div>

  <!-- Header Banner -->
  <section class="section-padding reveal active" style="padding-top: 140px; background: linear-gradient(180deg, rgba(37, 99, 235, 0.05), transparent); text-align: center;">
    <div class="container">
      <span class="category-badge" style="margin-bottom: 1rem;">Wall of Fame</span>
      <h1 style="font-size: 3rem; margin-bottom: 1rem;">Olympiad & Competitive Success</h1>
      <p class="text-muted" style="max-width: 600px; margin: 0 auto;">Celebrating the extraordinary milestones achieved by our students in JEE, NEET, and International Olympiad rounds.</p>
    </div>
  </section>

  <!-- Showcase Grid -->
  <section class="section-padding reveal" style="padding-top: 0;">
    <div class="container">
      <!-- Section: Featured Toppers -->
      <h2 style="font-size: 2rem; margin-bottom: 2rem; border-left: 4px solid var(--secondary); padding-left: 0.75rem;">Elite Achievers</h2>
      <div class="grid-3" id="results-featured-grid" style="margin-bottom: 5rem;">
        <!-- Featured Toppers Dynamic List -->
      </div>

      <!-- Section: General Ranks -->
      <h2 style="font-size: 2rem; margin-bottom: 2rem; border-left: 4px solid var(--accent); padding-left: 0.75rem;">Honour List</h2>
      <div class="grid-4" id="results-general-grid">
        <!-- General results dynamic list -->
      </div>
    </div>
  </section>

  <!-- Global Footer -->
  <div id="global-footer"></div>

  <!-- WhatsApp Bubble -->
  <div id="global-whatsapp"></div>

  <script type="module" src="../assets/js/main.js"></script>
  <script type="module">
    import { getCollection } from '../firebase/firebase-config.js';

    const initDynamicPage_sdv01 = async () => {
      await loadResultsPage();
    };
if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", initDynamicPage_sdv01); } else { initDynamicPage_sdv01(); }

    async function loadResultsPage() {
      const featuredContainer = document.getElementById("results-featured-grid");
      const generalContainer = document.getElementById("results-general-grid");
      if (!featuredContainer || !generalContainer) return;

      featuredContainer.innerHTML = `<div style="grid-column:1/-1; text-align:center;">Fetching student records...</div>`;

      try {
        const results = await getCollection("results");
        const visibleResults = results.filter(r => r.visible);

        // Featured vs General
        const featured = visibleResults.filter(r => r.featured);
        const general = visibleResults.filter(r => !r.featured);

        // Render Featured
        if (featured.length === 0) {
          featuredContainer.innerHTML = `<p class="text-muted text-center" style="grid-column: 1/-1;">No major milestones featured at this time.</p>`;
        } else {
          featuredContainer.innerHTML = '';
          featured.forEach(res => {
            const card = document.createElement("div");
            card.className = "glass-card text-center reveal active";
            card.style.padding = "2rem";
            card.style.border = "2px solid rgba(245, 158, 11, 0.3)";
            card.innerHTML = `
              <div class="flex-center" style="margin-bottom: 1.5rem;">
                <img src="${res.photoUrl || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150'}" alt="${res.studentName}" style="width: 130px; height: 130px; border-radius: 50%; border: 4px solid var(--accent); object-fit: cover;">
              </div>
              <span class="category-badge" style="margin-bottom: 0.75rem; background-color: rgba(245, 158, 11, 0.15); color: var(--accent-hover);">${res.achievementType}</span>
              <h3 style="font-size: 1.5rem; margin-bottom: 0.25rem;">${res.studentName}</h3>
              <p style="color: var(--secondary); font-size: 1.2rem; font-weight: 700; font-family: var(--font-heading); margin-bottom: 0.75rem;">${res.rank}</p>
              <p class="text-muted" style="font-size: 0.95rem;">${res.examName} • Score: <strong>${res.marks}</strong></p>
            `;
            featuredContainer.appendChild(card);
          });
        }

        // Render General
        if (general.length === 0) {
          generalContainer.innerHTML = `<p class="text-muted text-center" style="grid-column: 1/-1;">No additional listings available.</p>`;
        } else {
          generalContainer.innerHTML = '';
          general.forEach(res => {
            const card = document.createElement("div");
            card.className = "glass-card text-center reveal active";
            card.style.padding = "1.25rem";
            card.innerHTML = `
              <div class="flex-center" style="margin-bottom: 1rem;">
                <img src="${res.photoUrl || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&q=80&w=150'}" alt="${res.studentName}" style="width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--secondary); object-fit: cover;">
              </div>
              <h3 style="font-size: 1.15rem; margin-bottom: 0.25rem;">${res.studentName}</h3>
              <p style="color: var(--secondary); font-weight: 600; font-size: 0.95rem; margin-bottom: 0.5rem;">${res.rank}</p>
              <p class="text-muted" style="font-size: 0.8rem;">${res.examName} (${res.marks})</p>
            `;
            generalContainer.appendChild(card);
          });
        }

      } catch (err) {
        console.error("Results page error: ", err);
        featuredContainer.innerHTML = `<p class="text-muted text-center" style="grid-column: 1/-1;">Error rendering topper catalog.</p>`;
      }
    }
  </script>
</body>
</html>
