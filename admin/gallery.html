<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Management | MathScienceYJR CMS</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">

  <!-- Safety Loader Hide Fallback Script -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader && !loader.classList.contains('hidden')) {
          loader.classList.add('hidden');
          console.warn('Page loader hidden by safety fallback timeout.');
        }
      }, 1500);
    });
  </script>
</head>
<body>

  <div class="admin-wrapper">
    <!-- Sidebar -->
    <div id="admin-sidebar-container"></div>

    <main class="admin-main">
      <!-- Admin Header -->
      <div id="admin-header-container"></div>

      <div class="admin-content">
        <!-- Control actions row -->
        <div class="table-actions">
          <div class="search-bar">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="gallery-search" placeholder="Search by caption or album...">
          </div>
          <button class="btn btn-primary" id="open-add-gallery-modal">➕ Upload Gallery Photo</button>
        </div>

        <!-- Gallery Catalog Table -->
        <div class="content-box">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Thumbnail</th>
                  <th>Image Caption</th>
                  <th>Album/Category</th>
                  <th>Sort Order</th>
                  <th>Visibility</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="gallery-admin-tbody">
                <tr>
                  <td colspan="6" style="text-align:center; color:var(--text-muted);">Fetching media list...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Gallery Modal -->
  <div class="modal-overlay" id="gallery-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="gallery-modal-title">Upload Photo Details</h3>
        <button class="modal-close" id="close-gallery-modal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="gallery-editor-form">
          <input type="hidden" id="gallery-edit-id">

          <div class="form-group">
            <label for="gal-url-field" class="form-label">Photo Source URL</label>
            <input type="text" id="gal-url-field" class="form-control" placeholder="https://..." required>
          </div>

          <div class="form-group" style="margin-top:1rem;">
            <label for="gal-caption-field" class="form-label">Short Caption Description</label>
            <input type="text" id="gal-caption-field" class="form-control" placeholder="Visual Chemistry Lab sessions" required>
          </div>

          <div class="grid-2" style="margin-top:1rem;">
            <div class="form-group">
              <label for="gal-album-field" class="form-label">Album Tag (e.g. Infrastructure, Events)</label>
              <input type="text" id="gal-album-field" class="form-control" placeholder="Infrastructure" required>
            </div>
            <div class="form-group">
              <label for="gal-order-field" class="form-label">Display Order Index (number)</label>
              <input type="number" id="gal-order-field" class="form-control" value="1" min="1" required>
            </div>
          </div>

          <div class="form-group" style="margin-top:1.5rem; display:flex; align-items:center; gap:0.5rem;">
            <input type="checkbox" id="gal-visible-field" style="width:20px; height:20px; cursor:pointer;" checked>
            <label for="gal-visible-field" style="color:#cbd5e1; cursor:pointer;">Show in public gallery</label>
          </div>

          <div style="margin-top:2.5rem; display:flex; justify-content:flex-end; gap:1rem;">
            <button type="button" class="btn btn-outline" id="cancel-gallery-modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Image Details</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="../admin/js/admin-core.js"></script>
  <script type="module">
    import { getCollection, addDocument, updateDocument, deleteDocument } from '../firebase/firebase-config.js';

    let galleryList = [];

    if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", loadGalleryManager); } else { loadGalleryManager(); }

    async function loadGalleryManager() {
      const tbody = document.getElementById("gallery-admin-tbody");
      if (!tbody) return;

      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Loading image indexes...</td></tr>`;

      try {
        galleryList = await getCollection("gallery");
        renderAdminGallery(galleryList);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#ef4444;">Failed to read gallery DB.</td></tr>`;
      }
    }

    function renderAdminGallery(list) {
      const tbody = document.getElementById("gallery-admin-tbody");
      if (!tbody) return;

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">No images uploaded to gallery.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      // Sort list by order
      const sorted = [...list].sort((a, b) => a.order - b.order);

      sorted.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><img src="${item.imageUrl}" style="width:50px; height:50px; object-fit:cover; border-radius:4px; border:1px solid #1e293b;"></td>
          <td><strong>${item.caption}</strong></td>
          <td><span class="category-badge">${item.album}</span></td>
          <td>${item.order}</td>
          <td>
            <button class="action-btn toggle-visible-gal" data-id="${item.id}" data-visible="${item.visible}">
              ${item.visible ? '👁️ Live' : '👁️‍🗨️ Hidden'}
            </button>
          </td>
          <td>
            <div class="action-buttons">
              <button class="action-btn edit-gallery-btn" data-id="${item.id}">✏️ Edit</button>
              <button class="action-btn delete-gallery-btn" data-id="${item.id}">🗑️ Delete</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      bindTableActions();
    }

    function bindTableActions() {
      // Toggle Visibility
      document.querySelectorAll(".toggle-visible-gal").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          const vis = btn.getAttribute("data-visible") === "true";
          btn.disabled = true;
          await updateDocument("gallery", id, { visible: !vis });
          await loadGalleryManager();
        });
      });

      // Edit Click
      document.querySelectorAll(".edit-gallery-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.getAttribute("data-id");
          const item = galleryList.find(g => g.id === id);
          if (item) openModal(item);
        });
      });

      // Delete Click
      document.querySelectorAll(".delete-gallery-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-id");
          if (confirm("Permanently delete image from public gallery?")) {
            await deleteDocument("gallery", id);
            await loadGalleryManager();
          }
        });
      });
    }

    // Modal Control
    const modal = document.getElementById("gallery-modal");
    const openAddBtn = document.getElementById("open-add-gallery-modal");
    const closeBtn = document.getElementById("close-gallery-modal");
    const cancelBtn = document.getElementById("cancel-gallery-modal");
    const editorForm = document.getElementById("gallery-editor-form");

    openAddBtn.addEventListener("click", () => openModal(null));
    closeBtn.addEventListener("click", closeModal);
    cancelBtn.addEventListener("click", closeModal);

    function openModal(item = null) {
      editorForm.reset();
      
      if (item) {
        document.getElementById("gallery-modal-title").innerText = "Edit Image details";
        document.getElementById("gallery-edit-id").value = item.id;
        document.getElementById("gal-url-field").value = item.imageUrl;
        document.getElementById("gal-caption-field").value = item.caption;
        document.getElementById("gal-album-field").value = item.album;
        document.getElementById("gal-order-field").value = item.order;
        document.getElementById("gal-visible-field").checked = item.visible;
      } else {
        document.getElementById("gallery-modal-title").innerText = "Upload Photo Details";
        document.getElementById("gallery-edit-id").value = '';
        document.getElementById("gal-order-field").value = galleryList.length + 1;
        document.getElementById("gal-visible-field").checked = true;
      }
      modal.classList.add("active");
    }

    function closeModal() {
      modal.classList.remove("active");
    }

    editorForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = editorForm.querySelector("button[type='submit']");
      saveBtn.disabled = true;
      saveBtn.innerText = "Saving Image...";

      const id = document.getElementById("gallery-edit-id").value;

      const payload = {
        imageUrl: document.getElementById("gal-url-field").value,
        caption: document.getElementById("gal-caption-field").value,
        album: document.getElementById("gal-album-field").value,
        order: parseInt(document.getElementById("gal-order-field").value),
        visible: document.getElementById("gal-visible-field").checked
      };

      try {
        if (id) {
          await updateDocument("gallery", id, payload);
        } else {
          await addDocument("gallery", payload);
        }
        closeModal();
        await loadGalleryManager();
      } catch (err) {
        alert("Failed to save image entry.");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Save Image Details";
      }
    });

    // Search filter
    document.getElementById("gallery-search").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = galleryList.filter(g => 
        g.caption.toLowerCase().includes(q) || 
        g.album.toLowerCase().includes(q)
      );
      renderAdminGallery(filtered);
    });
  </script>
</body>
</html>
