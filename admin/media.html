<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Library | MathScienceYJR CMS</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/admin.css">

  <!-- Safety Loader Hide Fallback Script -->
  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        var loader = document.getElementById('loader');
        if (loader && !loader.classList.contains('hidden')) {
          loader.classList.add('hidden');
          console.warn('Page loader hidden by safety fallback timeout.');
        }
      }, 1500);
    });
  </script>
</head>
<body>

  <div class="admin-wrapper">
    <!-- Sidebar -->
    <div id="admin-sidebar-container"></div>

    <main class="admin-main">
      <!-- Admin Header -->
      <div id="admin-header-container"></div>

      <div class="admin-content">
        <!-- Media upload actions -->
        <div class="content-box">
          <div class="box-header">
            <h2>Upload New Media Asset</h2>
            <span style="font-size:0.85rem; color:var(--text-muted);">Max file size: 5MB. Supports JPG, PNG, WEBP, SVG</span>
          </div>

          <div style="border: 2px dashed #1e293b; border-radius: var(--border-radius-md); padding: 3rem; text-align: center;" id="drag-drop-zone">
            <div style="font-size: 3rem; margin-bottom: 1rem;">📤</div>
            <p style="margin-bottom: 1.5rem; color:#cbd5e1;">Drag and drop file here, or click to browse local files</p>
            <input type="file" id="media-file-input" style="display:none;" accept="image/*">
            <button class="btn btn-primary" onclick="document.getElementById('media-file-input').click()">Browse Files</button>
            <div id="upload-status" style="margin-top:1.5rem; font-weight:600; color:var(--secondary);"></div>
          </div>
        </div>

        <!-- Catalog list -->
        <div class="content-box">
          <div class="box-header">
            <h2>Media Assets Catalog</h2>
            <div class="search-bar" style="max-width:250px;">
              <input type="text" id="media-search-input" placeholder="Search by name...">
            </div>
          </div>

          <div class="media-grid" id="media-assets-grid">
            <!-- Catalog Cards Mount dynamically -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../admin/js/admin-core.js"></script>
  <script type="module">
    import { getCollection, uploadMedia, deleteDocument, listenCollection } from '../firebase/firebase-config.js';

    let mediaLibrary = [];

    if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", initMediaLibrary); } else { initMediaLibrary(); }

    function initMediaLibrary() {
      // Listen to catalog updates
      listenCollection("media", (files) => {
        mediaLibrary = files;
        renderMediaGrid(files);
      });

      // Uploader trigger
      const fileInput = document.getElementById("media-file-input");
      if (fileInput) {
        fileInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (file) {
            await handleMediaUpload(file);
          }
        });
      }

      // Drag and drop zone binding
      const dropZone = document.getElementById("drag-drop-zone");
      if (dropZone) {
        dropZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          dropZone.style.borderColor = "var(--secondary)";
          dropZone.style.backgroundColor = "rgba(37, 99, 235, 0.05)";
        });

        dropZone.addEventListener("dragleave", () => {
          dropZone.style.borderColor = "#1e293b";
          dropZone.style.backgroundColor = "transparent";
        });

        dropZone.addEventListener("drop", async (e) => {
          e.preventDefault();
          dropZone.style.borderColor = "#1e293b";
          dropZone.style.backgroundColor = "transparent";
          
          const file = e.dataTransfer.files[0];
          if (file) {
            await handleMediaUpload(file);
          }
        });
      }

      // Search binding
      document.getElementById("media-search-input").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        const filtered = mediaLibrary.filter(f => f.name.toLowerCase().includes(q));
        renderMediaGrid(filtered);
      });
    }

    async function handleMediaUpload(file) {
      const statusEl = document.getElementById("upload-status");
      statusEl.innerText = `Uploading ${file.name}... Please wait.`;
      
      try {
        await uploadMedia(file);
        statusEl.innerText = `Upload successful! Asset saved to library.`;
        setTimeout(() => statusEl.innerText = '', 3000);
      } catch (err) {
        console.error("Upload error: ", err);
        statusEl.innerText = `Upload failed. Try again.`;
      }
    }

    function renderMediaGrid(files) {
      const grid = document.getElementById("media-assets-grid");
      if (!grid) return;

      if (files.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding: 2rem; color:var(--text-muted);">No media assets cataloged.</p>`;
        return;
      }

      grid.innerHTML = '';
      files.forEach(file => {
        const card = document.createElement("div");
        card.className = "media-item reveal active";
        card.innerHTML = `
          <div class="media-preview">
            <img src="${file.url}" alt="${file.name}" loading="lazy">
          </div>
          <div class="media-actions">
            <div class="media-name" title="${file.name}">${file.name}</div>
            <div style="display:flex; gap:4px;">
              <button class="action-btn copy-url-btn" data-url="${file.url}" style="font-size:0.85rem;" title="Copy Storage URL">📋 Link</button>
              <button class="action-btn delete-media-btn" data-id="${file.id}" style="color:#ef4444; font-size:0.85rem;" title="Delete Asset">🗑️</button>
            </div>
          </div>
        `;

        // Bind copy link
        card.querySelector(".copy-url-btn").addEventListener("click", () => {
          navigator.clipboard.writeText(file.url);
          alert("Storage link copied to clipboard. You can paste this URL into other content manager pages.");
        });

        // Bind delete action
        card.querySelector(".delete-media-btn").addEventListener("click", async () => {
          if (confirm("Are you sure you want to delete this media asset? Any content referencing this link will encounter broken media.")) {
            await deleteDocument("media", file.id);
          }
        });

        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
